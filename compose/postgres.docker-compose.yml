version: '3.9'
services:
  postgres:
    container_name: postgres
    image: postgres:15.4
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_MULTIPLE_DATABASES="service_user_identity"
    ports:
      - '5432:5432'

  postgres-admin:
    image: adminer
    restart: always
    ports:
      - 8000:8080
