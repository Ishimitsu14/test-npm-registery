name: Publish Packages to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure NPM auth
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Find and publish all packages
        run: |
          packages=$(jq -r '.packages[]' publish-packages.json)
          for package in $packages; do
            if [ -d "$package" ]; then
              cd "$package"
          
              # Чтение локальной версии пакета
              local_version=$(jq -r '.version' package.json)
          
              # Получение последней опубликованной версии
              published_version=$(npm show $(jq -r '.name' package.json) version || echo "none")
          
              echo "Checking package: $(jq -r '.name' package.json)"
              echo "Local version: $local_version"
              echo "Published version: $published_version"

              # Проверка версии и публикация, если она изменилась
              if [ "$local_version" != "$published_version" ]; then
                echo "Publishing $package (local version $local_version differs from published version $published_version)"
                npm publish --access public
              else
                echo "Skipping $package, version $local_version is already published."
              fi
          
              cd - > /dev/null
            else
              echo "Directory $package does not exist, skipping."
            fi
          done
